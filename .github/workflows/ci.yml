name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v5

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 🟢 Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 🧶 Enable corepack
        run: corepack enable

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🔎 Typecheck
        run: yarn typecheck

      - name: 🧹 Lint
        run: yarn lint

      - name: 🧪 Test
        run: yarn test
